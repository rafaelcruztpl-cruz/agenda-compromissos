<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Executiva de Eventos</title><style>:root{--b:#0a5a5a;--d:#0b4141;--bg:#f4f7f7;--ln:#d7e2e2;--tx:#173333;--mu:#647575;--rd:#b42318;--am:#b54708;--gr:#067647}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}header{background:var(--d);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.82;font-size:12px}.btn{background:#e8eeee;color:var(--tx);text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:700}main{max-width:1500px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:9px}label{font-size:11px;font-weight:700;color:var(--mu)}input,select{width:100%;padding:8px;border:1px solid #cbd8d8;border-radius:7px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--b);border-radius:10px;padding:12px}.card b{font-size:24px;display:block}.card span{font-size:11px;color:var(--mu)}.layout{display:grid;grid-template-columns:minmax(760px,2fr) minmax(330px,1fr);gap:14px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:5px}.day{min-height:115px;border:1px solid var(--ln);border-radius:8px;padding:6px;background:#fff}.ev{font-size:10px;padding:5px;border-left:4px solid var(--am);border-radius:5px;background:#fff8df;margin:3px 0}.ev.ready{border-color:var(--gr);background:#edf8f3}.ev.risk{border-color:var(--rd);background:#fff0ef}.list{max-height:760px;overflow:auto}.item{padding:10px 0;border-bottom:1px solid #edf1f1}.meta{font-size:10px;color:var(--mu)}.vad{display:inline-block;background:#d7f0e5;color:#075b3d;border-radius:999px;padding:1px 5px;font-size:9px;font-weight:800}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}</style></head><body><header><div><h1>Agenda Executiva de Eventos</h1><p>Somente leitura · base compartilhada online</p></div><a class="btn" href="/gestao">Abrir gestão</a></header><main><div class="panel filters"><label>Mês<input id="month" type="month"></label><label>Executivo<select id="exec"></select></label><label>BU<select id="bu"><option value="">Todas</option><option>OMADA</option><option>VIGI</option></select></label><label>Distribuidor<select id="dist"></select></label><label>Categoria<select id="cat"><option value="">Todas</option><option>VAD</option><option>Foco</option><option>Não foco</option></select></label><label>Status<select id="status"></select></label><label>Exibição<select id="scope"><option value="active">Somente ativos</option><option value="all">Todos</option></select></label></div><div id="cards" class="cards"></div><div class="layout"><section class="panel"><h2 id="title" style="text-align:center"></h2><div id="cal" class="cal"></div></section><aside class="panel"><h2>Eventos do período</h2><div id="list" class="list"></div></aside></div></main><script>const $=id=>document.getElementById(id);let DATA=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=d=>d?d.split('-').reverse().join('/'):'Sem data';const opts=a=>'<option value="">Todos</option>'+a.map(v=>'<option>'+esc(v)+'</option>').join('');function ready(e){if(['Realizado','Concluído'].includes(e.status))return'Pronto';if(!e.startDate)return'Bloqueado';return e.readiness||'Em atenção'}function filt(){const m=$('month').value;return DATA.filter(e=>(!m||String(e.startDate||'').startsWith(m))&&(!$('exec').value||e.executive===$('exec').value)&&(!$('bu').value||e.bu===$('bu').value)&&(!$('dist').value||e.distributor===$('dist').value)&&(!$('cat').value||String(e.clientType||'').toLowerCase()===$('cat').value.toLowerCase())&&(!$('status').value||e.status===$('status').value)&&($('scope').value==='all'||!['Realizado','Concluído','Cancelado'].includes(e.status)))}function render(){const a=filt();$('cards').innerHTML=[[a.length,'Eventos no filtro'],[a.filter(e=>['Em risco','Bloqueado'].includes(ready(e))).length,'Em risco/bloqueados'],[a.filter(e=>e.internalApproval!=='Aprovado'&&!['Realizado','Concluído','Cancelado'].includes(e.status)).length,'Sem aprovação'],[a.filter(e=>['Em andamento','Confirmado'].includes(e.clientExecution)).length,'Cliente executando'],[a.filter(e=>ready(e)==='Pronto').length,'Prontos']].map(x=>'<div class="card"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');const [y,m]=$('month').value.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0);$('title').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let h=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<first.getDay();i++)h+='<div class="day"></div>';for(let d=1;d<=last.getDate();d++){const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=a.filter(e=>e.startDate===ds);h+='<div class="day"><b>'+d+'</b>'+ev.slice(0,5).map(e=>'<div class="ev '+(ready(e)==='Pronto'?'ready':(['Em risco','Bloqueado'].includes(ready(e))?'risk':''))+'">'+(String(e.clientType).toUpperCase()==='VAD'?'<span class="vad">VAD</span> ':'')+esc(e.distributor)+' · '+esc(e.type)+'</div>').join('')+'</div>'}$('cal').innerHTML=h;$('list').innerHTML=a.sort((x,y)=>(x.startDate||'9999').localeCompare(y.startDate||'9999')).map(e=>'<div class="item"><b>'+(String(e.clientType).toUpperCase()==='VAD'?'<span class="vad">VAD</span> ':'')+esc(e.distributor)+' · '+esc(e.type)+'</b><div>'+fmt(e.startDate)+' · '+esc(e.city)+'</div><div class="meta">'+esc(e.executive)+' · '+esc(e.status)+' · '+esc(ready(e))+'</div></div>').join('')||'<div class="meta">Nenhum evento neste filtro.</div>'}async function init(){const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json();DATA=s.events||[];$('exec').innerHTML=opts([...new Set(DATA.map(x=>x.executive).filter(Boolean))].sort());$('dist').innerHTML=opts([...new Set(DATA.map(x=>x.distributor).filter(Boolean))].sort());$('status').innerHTML=opts([...new Set(DATA.map(x=>x.status).filter(Boolean))].sort());$('month').value=new Date().toISOString().slice(0,7);render()}document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',render));init();</script></body></html>
