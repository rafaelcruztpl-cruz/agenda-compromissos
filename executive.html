<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Executiva de Eventos</title><style>:root{--b:#0a5a5a;--d:#0b4141;--bg:#f4f7f7;--ln:#d7e2e2;--tx:#173333;--mu:#647575;--rd:#b42318;--am:#b54708;--gr:#067647}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}header{background:var(--d);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.82;font-size:12px}.btn{background:#e8eeee;color:var(--tx);text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:700}main{max-width:1500px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:9px}label{font-size:11px;font-weight:700;color:var(--mu)}input,select{width:100%;padding:8px;border:1px solid #cbd8d8;border-radius:7px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--b);border-radius:10px;padding:12px}.card b{font-size:24px;display:block}.card span{font-size:11px;color:var(--mu)}.layout{display:grid;grid-template-columns:minmax(760px,2fr) minmax(330px,1fr);gap:14px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:5px}.day{min-height:115px;border:1px solid var(--ln);border-radius:8px;padding:6px;background:#fff}.ev{font-size:10px;padding:5px;border-left:4px solid var(--am);border-radius:5px;background:#fff8df;margin:3px 0}.ev.ready{box-shadow:inset 0 0 0 1px #16a34a}.ev.risk{box-shadow:inset 0 0 0 1px #dc2626}.type-cert{border-color:#0f766e;background:#ecfdf5;color:#134e4a}.type-day{border-color:#0891b2;background:#ecfeff;color:#164e63}.type-webinar{border-color:#7c3aed;background:#f5f3ff;color:#4c1d95}.type-workshop{border-color:#ea580c;background:#fff7ed;color:#7c2d12}.type-training{border-color:#2563eb;background:#eff6ff;color:#1e3a8a}.type-happy{border-color:#db2777;background:#fdf2f8;color:#831843}.type-visit{border-color:#64748b;background:#f8fafc;color:#334155}.type-sector{border-color:#dc2626;background:#fef2f2;color:#7f1d1d}.type-campaign{border-color:#ca8a04;background:#fefce8;color:#713f12}.type-other{border-color:#6b7280;background:#f9fafb;color:#374151}.ev.prep{font-weight:650}.prep-d60{border-color:#475569;background:#f1f5f9;color:#334155}.prep-d45{border-color:#ca8a04;background:#fefce8;color:#713f12}.prep-d30{border-color:#ea580c;background:#fff7ed;color:#7c2d12}.prep-d15{border-color:#7c3aed;background:#f5f3ff;color:#4c1d95}.prep-d7{border-color:#16a34a;background:#f0fdf4;color:#14532d}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.legend span{font-size:10px;padding:4px 7px;border-radius:999px;border-left:4px solid #999;background:#fff}.legend .sep{border:0;background:transparent;padding-left:0;font-weight:800;color:var(--mu)}.list{max-height:760px;overflow:auto}.item{padding:10px 0;border-bottom:1px solid #edf1f1}.meta{font-size:10px;color:var(--mu)}.vad{display:inline-block;background:#d7f0e5;color:#075b3d;border-radius:999px;padding:1px 5px;font-size:9px;font-weight:800}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}</style></head><body><header><div><h1>Agenda Executiva de Eventos</h1><p>Somente leitura · base compartilhada online</p></div><div style="display:flex;gap:8px;align-items:center"><span id="who" style="font-size:11px;opacity:.85"></span><a id="manageBtn" class="btn" href="/gestao">Abrir gestão</a><button id="logoutBtn" class="btn" style="border:0;cursor:pointer">Sair</button></div></header><main><div class="legend"><span class="sep">Tipos:</span><span class="type-cert">Certificação</span><span class="type-day">Omada Day</span><span class="type-webinar">Webinar</span><span class="type-workshop">Workshop</span><span class="type-training">Treinamento</span><span class="type-sector">Evento do setor</span><span class="type-campaign">Campanha</span><span class="sep">Etapas:</span><span class="prep-d60">D-60</span><span class="prep-d45">D-45</span><span class="prep-d30">D-30</span><span class="prep-d15">D-15</span><span class="prep-d7">D+7</span></div><div class="panel filters"><label>Mês<input id="month" type="month"></label><label>Executivo<select id="exec"></select></label><label>BU<select id="bu"><option value="">Todas</option><option>OMADA</option><option>VIGI</option></select></label><label>Distribuidor<select id="dist"></select></label><label>Categoria<select id="cat"><option value="">Todas</option><option>VAD</option><option>Foco</option><option>Não foco</option></select></label><label>Status<select id="status"></select></label><label>Exibição<select id="scope"><option value="active">Somente ativos</option><option value="all">Todos</option></select></label></div><div id="cards" class="cards"></div><div class="layout"><section class="panel"><h2 id="title" style="text-align:center"></h2><div id="cal" class="cal"></div></section><aside class="panel"><h2>Eventos do período</h2><div id="list" class="list"></div></aside></div></main><script>const $=id=>document.getElementById(id);let DATA=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=d=>d?d.split('-').reverse().join('/'):'Sem data';const opts=a=>'<option value="">Todos</option>'+a.map(v=>'<option>'+esc(v)+'</option>').join('');function ready(e){if(['Realizado','Concluído'].includes(e.status))return'Pronto';if(!e.startDate)return'Bloqueado';return e.readiness||'Em atenção'}function baseFilt(){return DATA.filter(e=>(!$('exec').value||e.executive===$('exec').value)&&(!$('bu').value||e.bu===$('bu').value)&&(!$('dist').value||e.distributor===$('dist').value)&&(!$('cat').value||String(e.clientType||'').toLowerCase()===$('cat').value.toLowerCase())&&(!$('status').value||e.status===$('status').value)&&($('scope').value==='all'||!['Realizado','Concluído','Cancelado'].includes(e.status)))}function filt(){const m=$('month').value;return baseFilt().filter(e=>!m||String(e.startDate||'').startsWith(m))}function shiftDate(date,days){const x=new Date(date+'T12:00:00');x.setDate(x.getDate()+days);return x.toISOString().slice(0,10)}function prepItems(e){if(e.prepRule!=='D60_D45_D30_D15_D7'||!e.startDate)return[];const base=e.endDate||e.startDate;return[{date:shiftDate(e.startDate,-60),label:'D-60 Briefing'},{date:shiftDate(e.startDate,-45),label:'D-45 Aprovação'},{date:shiftDate(e.startDate,-30),label:'D-30 Produção'},{date:shiftDate(e.startDate,-15),label:'D-15 Mobilização'},{date:shiftDate(base,7),label:'D+7 Resultado'}]}function eventLabel(e){return esc(e.distributor?e.distributor+' · '+e.type:(e.theme||e.type))}function slugType(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function typeClass(e){const t=slugType(e.type);if(t.includes('certificacao'))return'type-cert';if(t.includes('omada-day'))return'type-day';if(t.includes('webinar'))return'type-webinar';if(t.includes('workshop'))return'type-workshop';if(t.includes('treinamento'))return'type-training';if(t.includes('happy-hour'))return'type-happy';if(t.includes('visita'))return'type-visit';if(t.includes('evento-do-setor'))return'type-sector';if(t.includes('campanha'))return'type-campaign';return'type-other'}function prepClass(label){if(label.startsWith('D-60'))return'prep-d60';if(label.startsWith('D-45'))return'prep-d45';if(label.startsWith('D-30'))return'prep-d30';if(label.startsWith('D-15'))return'prep-d15';return'prep-d7'}function render(){const a=filt();$('cards').innerHTML=[[a.length,'Eventos no filtro'],[a.filter(e=>['Em risco','Bloqueado'].includes(ready(e))).length,'Em risco/bloqueados'],[a.filter(e=>e.internalApproval!=='Aprovado'&&!['Realizado','Concluído','Cancelado'].includes(e.status)).length,'Sem aprovação'],[a.filter(e=>['Em andamento','Confirmado'].includes(e.clientExecution)).length,'Cliente executando'],[a.filter(e=>ready(e)==='Pronto').length,'Prontos']].map(x=>'<div class="card"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');const [y,m]=$('month').value.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0);$('title').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let h=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<first.getDay();i++)h+='<div class="day"></div>';for(let d=1;d<=last.getDate();d++){const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),base=baseFilt(),ev=base.filter(e=>e.startDate===ds),prep=base.flatMap(e=>prepItems(e).filter(p=>p.date===ds).map(p=>({event:e,...p})));h+='<div class="day"><b>'+d+'</b>'+prep.slice(0,5).map(p=>'<div class="ev prep '+prepClass(p.label)+'">'+esc(p.label)+' · '+eventLabel(p.event)+'</div>').join('')+ev.slice(0,5).map(e=>'<div class="ev '+typeClass(e)+' '+(ready(e)==='Pronto'?'ready':(['Em risco','Bloqueado'].includes(ready(e))?'risk':''))+'">'+(String(e.clientType).toUpperCase()==='VAD'?'<span class="vad">VAD</span> ':'')+eventLabel(e)+'</div>').join('')+'</div>'}$('cal').innerHTML=h;$('list').innerHTML=a.sort((x,y)=>(x.startDate||'9999').localeCompare(y.startDate||'9999')).map(e=>'<div class="item"><b>'+(String(e.clientType).toUpperCase()==='VAD'?'<span class="vad">VAD</span> ':'')+esc(e.distributor)+' · '+esc(e.type)+'</b><div>'+fmt(e.startDate)+' · '+esc(e.city)+'</div><div class="meta">'+esc(e.executive)+' · '+esc(e.status)+' · '+esc(ready(e))+'</div></div>').join('')||'<div class="meta">Nenhum evento neste filtro.</div>'}async function init(){const me=await fetch('/api/auth/me',{cache:'no-store'});if(!me.ok){location.href='/login';return}const u=await me.json();$('who').textContent=(u.displayName||u.username)+' · '+({admin:'Administrador',operator:'Operador',read_only:'Somente leitura'}[u.role]||u.role);if(u.role==='read_only')$('manageBtn').style.display='none';$('logoutBtn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login'};const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json();DATA=s.events||[];$('exec').innerHTML=opts([...new Set(DATA.map(x=>x.executive).filter(Boolean))].sort());$('dist').innerHTML=opts([...new Set(DATA.map(x=>x.distributor).filter(Boolean))].sort());$('status').innerHTML=opts([...new Set(DATA.map(x=>x.status).filter(Boolean))].sort());$('month').value=new Date().toISOString().slice(0,7);render()}document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',render));init();</script></body></html>
