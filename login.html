<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda de Compromissos — Login</title><style>:root{--b:#0a5a5a;--d:#0b4141;--bg:#eef3f3;--tx:#173333;--mu:#667777;--ln:#d6e1e1}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#e9f2f2,#f7f9f9);color:var(--tx);min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--ln);border-radius:16px;padding:28px;box-shadow:0 18px 50px #0b414115}.brand{font-size:13px;font-weight:800;color:var(--b);text-transform:uppercase;letter-spacing:.06em}h1{font-size:26px;margin:8px 0 4px}p{color:var(--mu);font-size:13px;margin:0 0 20px}label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #cbd8d8;border-radius:8px;font:inherit}button{width:100%;border:0;background:var(--b);color:#fff;padding:12px;border-radius:8px;font-weight:800;margin-top:18px;cursor:pointer}.err{display:none;background:#fee4e2;color:#b42318;padding:9px;border-radius:8px;margin-top:12px;font-size:12px}.foot{font-size:11px;color:#8a9696;margin-top:18px;text-align:center}</style></head><body><form class="box" id="login"><div class="brand">Omada + VIGI</div><h1>Agenda de Compromissos</h1><p>Acesso protegido. Entre com seu usuário e senha.</p><label>Usuário<input id="username" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><div id="err" class="err"></div><div class="foot">Trade Marketing ENBU</div></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.style.display='none';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(r.ok){location.href='/'}else{const x=await r.json().catch(()=>({error:'Falha ao entrar'}));err.textContent=x.error||'Falha ao entrar';err.style.display='block'}};</script></body></html>
