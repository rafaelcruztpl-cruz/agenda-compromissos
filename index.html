const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=d=>d?d.split('-').reverse().join('/'):'Sem data';
function opts(a){return '<option value="">Todos</option>'+a.map(v=>'<option>'+esc(v)+'</option>').join('')}
function init(){const E=DATA.events;$('exec').innerHTML=opts([...new Set(E.map(x=>x.executive).filter(Boolean))].sort());$('dist').innerHTML=opts([...new Set(E.map(x=>x.distributor).filter(Boolean))].sort());$('status').innerHTML=opts([...new Set(E.map(x=>x.status).filter(Boolean))].sort());const dated=E.map(x=>x.startDate).filter(Boolean).sort();$('month').value=dated.length?dated[Math.max(0,dated.length-1)].slice(0,7):new Date().toISOString().slice(0,7);$('updated').textContent=new Date(DATA.generatedAt).toLocaleString('pt-BR');render()}
function filt(){const m=$('month').value;return DATA.events.filter(e=>(!m||String(e.startDate||'').startsWith(m))&&(!$('exec').value||e.executive===$('exec').value)&&(!$('bu').value||e.bu===$('bu').value)&&(!$('dist').value||e.distributor===$('dist').value)&&(!$('cat').value||String(e.clientType||'').toLowerCase()===$('cat').value.toLowerCase())&&(!$('status').value||e.status===$('status').value)&&($('scope').value==='all'||!['Concluído','Cancelado','Realizado'].includes(e.status)))}

function render(){const a=filt();$('cards').innerHTML=[[a.length,'Eventos no filtro'],[a.filter(e=>['Em risco','Bloqueado'].includes(e.readiness)).length,'Em risco/bloqueados'],[a.filter(e=>e.internalApproval!=='Aprovado').length,'Sem aprovação'],[a.filter(e=>['Em andamento','Confirmado'].includes(e.clientExecution)).length,'Cliente executando'],[a.filter(e=>e.readiness==='Pronto').length,'Prontos']].map(x=>'<div class="card"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');renderCal(a);$('list').innerHTML=a.sort((x,y)=>(x.startDate||'9999').localeCompare(y.startDate||'9999')).map(e=>'<div class="item"><h3>'+label(e)+'</h3><div>'+fmt(e.startDate)+' · '+esc(e.city)+'</div><div class="meta">'+esc(e.executive)+' · '+esc(e.status)+' · '+esc(e.readiness)+'</div><div><span class="pill">Aprovação: '+esc(e.internalApproval)+'</span><span class="pill">Execução: '+esc(e.clientExecution)+'</span></div>'+(e.nextAction?'<div class="meta"><b>Próxima ação:</b> '+esc(e.nextAction)+(e.actionDeadline?' até '+fmt(e.actionDeadline):'')+'</div>':'')+'</div>').join('')||'<div class="empty">Nenhum evento neste filtro.</div>'}
function renderCal(a){const [y,m]=$('month').value.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),off=first.getDay(),days=last.getDate();$('title').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let h=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<off;i++)h+='<div class="day"></div>';for(let d=1;d<=days;d++){const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=a.filter(e=>e.startDate===ds);h+='<div class="day"><div class="daynum">'+d+'</div>'+ev.slice(0,4).map(e=>'<div class="ev '+cls(e)+'"><b>'+label(e)+'</b><div class="meta">'+esc(e.executive)+'</div></div>').join('')+(ev.length>4?'<div class="meta">+'+(ev.length-4)+' eventos</div>':'')+'</div>'}$('calendar').innerHTML=h}
